version: '3.9'

services:

  # ───────────────────────────────────────────
  # MongoDB
  # ───────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: neetcode_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"          
      - mongo_data:/data/db   
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  backend:
    build: .
    container_name: neetcode_backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/${MONGO_DB}?authSource=admin
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data:ro   # JSON files — read only
    depends_on:
      mongo:
        condition: service_healthy   

 
  seeder:
    build: .
    container_name: neetcode_seeder
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/${MONGO_DB}?authSource=admin
    volumes:
      - ./data:/app/data:ro
    command: node backend/seeders/importData.js
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - seed                  

volumes:
  mongo_data:
