<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      margin: 0;
    }

    .sidebar {
      width: 200px;
      background: #333;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      background: #555;
      color: white;
      border: none;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h2>Admin</h2>
    <button onclick="showUsers()">Users</button>
    <button onclick="showCompanies()">Companies</button>
    <button onclick="showJobs()">Jobs</button>
  </div>

  <div class="main">
    <h1>Welcome Admin</h1>
    <div id="content"></div>
  </div>

  <script>

let users = [
  { name: "Ahmad", email: "ahmad@gmail.com" },
  { name: "Sara", email: "sara@gmail.com" },
  { name: "Ali", email: "ali@gmail.com" }
];

let companies = [];
let jobs = [];

function showUsers() {
  let content = `
    <h2>Users</h2>
    <table border="1" cellpadding="10">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
      </tr>
  `;

  users.forEach((user, index) => {
    content += `
      <tr>
        <td>${user.name}</td>
        <td>${user.email}</td>
        <td><button onclick="deleteUser(${index})">Delete</button></td>
      </tr>
    `;
  });

  content += `</table>`;

  document.getElementById("content").innerHTML = content;
}

function deleteUser(index) {
  users.splice(index, 1);
  showUsers();
}

function showCompanies() {
  let content = `
    <h2>Companies</h2>

    <input type="text" id="companyName" placeholder="Company Name">
    <button onclick="addCompany()">Add</button>

    <ul>
  `;

  companies.forEach((company, index) => {
    content += `<li>${company} <button onclick="deleteCompany(${index})">Delete</button></li>`;
  });

  content += `</ul>`;

  document.getElementById("content").innerHTML = content;
}
function addCompany() {
  let name = document.getElementById("companyName").value;

  if (name !== "") {
    companies.push(name);
    showCompanies();
  }
}

function deleteCompany(index) {
  companies.splice(index, 1);
  showCompanies();
}
function showJobs() {

  let content = `
    <h2>Jobs</h2>

    <input type="text" id="jobTitle" placeholder="Job Title">

    <select id="jobCompany">
      ${companies.map(c => `<option>${c}</option>`).join("")}
    </select>

    <button onclick="addJob()">Add Job</button>

    <ul>
  `;

  jobs.forEach((job, index) => {
    content += `<li>${job.title} - ${job.company} 
    <button onclick="deleteJob(${index})">Delete</button></li>`;
  });

  content += `</ul>`;

  document.getElementById("content").innerHTML = content;
}

function addJob() {
  let title = document.getElementById("jobTitle").value;
  let company = document.getElementById("jobCompany").value;

  if (title !== "") {
    jobs.push({ title, company });
    showJobs();
  }
}

function deleteJob(index) {
  jobs.splice(index, 1);
  showJobs();
}

</script>ّ
</body>
</html>
